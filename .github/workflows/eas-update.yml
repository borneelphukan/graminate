name: Mobile OTA Update

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: false
        default: Manual update

concurrency:
  group: mobile-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Expo
        uses: expo/expo-action@v1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish EAS Update
        working-directory: ./apps/mobile
        run: |
          eas update \
            --branch main \
            --message "${{ inputs.message || github.event.head_commit.message || 'CI update' }}" \
            --non-interactive
